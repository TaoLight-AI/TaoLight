<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><meta name="theme-color" content="#6d28d9"><title>程楠训练反馈</title><link rel="stylesheet" href="./style.css?v=20260823-2"></head><body><main class="shell"><header class="hero"><div class="brand">CN · 程楠训练反馈</div><p class="eyebrow">PERSONAL PERFORMANCE LOG</p><h1>想做太阳发光，<br><em>灼烧梦想地方</em></h1><div class="guard">● 眼部保护优先 · 不震动 · 不憋气 · 不力竭</div></header><nav class="tabs"><button class="active" data-tab="form">今日反馈</button><button data-tab="history">历史日历</button><button data-tab="coach">教练报告</button></nav><div id="notice" class="notice hidden"></div>
<form id="logForm"><div id="formView"><section class="card orange-card"><h2><span class="num">01</span>当天状态</h2><div class="grid two"><label>日期<input id="date" name="logDate" type="date" required></label><label>训练类型<select name="sessionType"><option>上肢 A</option><option>下肢 A</option><option>恢复快走</option><option>上肢 B</option><option>下肢 B</option><option>耐力快走</option><option>恢复 / 休息</option></select></label></div><div class="grid three"><label>睡眠（小时）<input name="sleepHours" type="number" step="0.1"></label><label>夜醒 / 夜尿<input name="wakeCount" type="number"></label><label>精力 1–5<input name="energy" type="number" min="1" max="5"></label></div><label>晨间静息心率<input name="restingHr" type="number"></label></section>
<section class="card pink-card"><h2><span class="num">02</span>训练表现</h2><div class="grid three"><label>时长（分钟）<input name="duration" type="number"></label><label>平均心率<input name="avgHr" type="number"></label><label>最高心率<input name="maxHr" type="number"></label></div><label>计划完成度（%）<input name="completion" type="number" min="0" max="100"></label><label>动作 × 重量 × 次数<textarea name="exercises" rows="6" placeholder="坐姿划船 20kg｜3×10｜RIR 3"></textarea></label></section>
<section class="card blue-card"><h2><span class="num">03</span>恢复与摄入</h2><label>当天饮食<textarea name="meals" rows="5" placeholder="早餐 / 午餐 / 晚餐 / 加餐，尽量记录蛋白质来源"></textarea></label><label>不适与异常<textarea name="symptoms" rows="3" placeholder="没有就写“无”；如有眼部、胸部、头晕等异常请具体记录"></textarea></label><label>补充备注<textarea name="notes" rows="3"></textarea></label></section>
<section class="card lime-card"><h2><span class="num">04</span>截图上传</h2><label class="upload"><input id="files" type="file" accept="image/*" multiple><b id="fileText">选择训练 / 睡眠 / 饮食截图</b><small>最多6张，上传前自动压缩</small></label></section><button id="save" class="submit">保存今天的反馈</button></div></form>
<section id="historyView" class="hidden"><div class="section-head"><div><p class="kicker">HISTORY</p><h2>历史训练档案</h2></div><span id="historyCount" class="pill">0 条</span></div><section class="filter-card"><label>选择日期查看<input id="historyDate" type="date"></label><div class="filter-actions"><button id="showDate" class="small-btn">查看该日</button><button id="showAll" class="ghost-btn">全部记录</button></div></section><div id="dateStrip" class="date-strip"></div><div id="logs">打开后读取记录</div></section>
<section id="coachView" class="hidden"><div class="section-head"><div><p class="kicker">COACH REPORT</p><h2>程楠专属教练报告</h2></div><button id="refreshReport" class="small-btn">重新分析</button></div><div id="coachLoading" class="report-placeholder">读取记录后生成恢复、训练与睡眠分析…</div><div id="coachReport" class="hidden"></div><p class="disclaimer">报告用于训练管理与趋势观察，不替代心血管、眼科或睡眠医学诊断。出现视力变化、眼痛、胸闷、晕厥或异常心悸时应停止训练并就医。</p></section>
</main><script src="./script.js?v=20260823-2"></script></body></html>
