name: AI Gateway Smoke

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/gateway-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run gateway smoke test
        working-directory: server
        run: node test.js
