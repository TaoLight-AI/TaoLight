<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7d9cc">
<title>桃紫有光 · 大圣故事工坊</title>
<style>
:root{--peach:#c66d7f;--cream:#fffaf1;--wood:#735548;--sage:#839276}
*{box-sizing:border-box}body{margin:0;background:#e8dfd5;color:#493a33;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.home{position:relative;width:min(430px,100%);min-height:100svh;margin:auto;overflow:hidden;padding:calc(env(safe-area-inset-top) + 20px) 25px calc(env(safe-area-inset-bottom) + 25px);background:linear-gradient(#f7d9cc,#f5e7d6 37%,#d9ddc7 73%,#b9c3a7)}
.home:before,.home:after{content:"";position:absolute;bottom:-8%;border-radius:50% 50% 0 0;background:#5b714e55}.home:before{left:-30%;width:108%;height:32%;transform:rotate(5deg)}.home:after{right:-38%;width:112%;height:27%;background:#465e4047;transform:rotate(-6deg)}
.glow{position:absolute;top:-80px;right:-70px;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,#fff9d3ee,#ffe5c444 55%,transparent 72%);animation:breathe 5s ease-in-out infinite}
.mist{position:absolute;width:340px;height:70px;border-radius:50%;background:#fff5;filter:blur(15px);animation:drift 11s ease-in-out infinite alternate}.mist.a{top:31%;left:-150px}.mist.b{top:49%;right:-170px;animation-delay:-4s}
.brand{position:relative;z-index:5;display:flex;align-items:center;gap:10px;color:#624940}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #7e444199;border-radius:10px;color:#8f4f52;font-family:serif;font-size:18px;transform:rotate(-3deg)}.brand-cn{font:600 15px serif;letter-spacing:3px}.brand-en{display:block;margin-top:2px;font-size:8px;letter-spacing:2px;opacity:.62}
.leaf{position:absolute;z-index:2;color:#5e784c70;font-size:36px;animation:leaf 7s ease-in-out infinite}.l1{left:2%;top:22%}.l2{right:5%;top:38%;animation-delay:-2s}.l3{left:10%;top:56%;animation-delay:-5s;font-size:26px}
.hero{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.character-wrap{position:relative;width:175px;height:185px;opacity:0;transform:translateY(18px) scale(.92);transition:1s}.character-wrap.ready{opacity:1;transform:none}.halo{position:absolute;inset:10px 14px 3px;border-radius:50%;background:radial-gradient(circle,#fff5d3cc,#ffe9d32e 58%,transparent 72%);animation:breathe 4.5s infinite}
.character{position:absolute;left:50%;bottom:4px;width:125px;height:153px;transform:translateX(-50%);animation:float 5.4s ease-in-out infinite}.face{position:absolute;z-index:5;top:5px;left:27px;width:73px;height:71px;border-radius:48% 48% 44% 44%;background:linear-gradient(145deg,#9a7258,#6f5142);box-shadow:inset 0 0 0 7px #f4c79d3d}.ear{position:absolute;z-index:3;top:28px;width:25px;height:32px;border-radius:50%;background:#7d5b48}.ear.left{left:15px}.ear.right{right:15px}.eye{position:absolute;top:32px;width:5px;height:6px;border-radius:50%;background:#382b25}.eye.left{left:22px}.eye.right{right:22px}.smile{position:absolute;left:50%;top:44px;width:20px;height:10px;border-bottom:3px solid #4d352e;border-radius:50%;transform:translateX(-50%) rotate(-4deg)}
.body{position:absolute;z-index:3;left:13px;bottom:2px;width:99px;height:88px;border-radius:41px 41px 19px 19px;background:linear-gradient(145deg,#a98668,#81624e)}.belly{position:absolute;left:22px;bottom:8px;width:56px;height:46px;border-radius:50%;background:#e1be962b}.cape{position:absolute;z-index:2;left:4px;right:4px;bottom:0;height:78px;border-radius:50px 50px 14px 14px;background:linear-gradient(135deg,#c66d7f,#9b5265)}
.arm{position:absolute;z-index:6;width:51px;height:17px;border-radius:18px;background:#866550}.arm.peach-arm{left:-4px;top:86px;transform:rotate(-28deg)}.arm.selfie-arm{right:-5px;top:88px;transform:rotate(30deg)}.hand{position:absolute;right:-2px;top:-1px;width:19px;height:19px;border-radius:50%;background:#9a755d}.peach{position:absolute;right:-13px;top:-20px;width:29px;height:27px;border-radius:50%;background:linear-gradient(135deg,#efb18f,#d97d8e)}.peach:after{content:"";position:absolute;left:14px;top:-5px;width:2px;height:7px;background:#765b43}.peach-leaf{position:absolute;left:16px;top:-5px;width:10px;height:5px;border-radius:100% 0;background:#738469}
.selfie{position:absolute;z-index:7;right:-36px;top:7px;width:59px;height:117px;transform:rotate(18deg)}.phone{position:absolute;right:0;width:32px;height:50px;border:3px solid #69564e;border-radius:7px;background:#f2e8d9}.stick{position:absolute;right:16px;top:48px;width:3px;height:60px;background:#5d5550}.bubble{position:absolute;right:-18px;top:28px;padding:5px 8px;border-radius:12px 12px 12px 3px;background:#fffaf0ed;color:#965466;font:600 11px serif;animation:wave 3s infinite}
.kicker{display:block;color:#8f5b53;font-size:10px;letter-spacing:2px}.title{display:block;margin-top:4px;color:#493a33;font:600 29px serif;letter-spacing:3px}.promise{display:block;margin-top:5px;color:#533e33b8;font:500 13px serif;letter-spacing:1px}
.dialogue{width:100%;min-height:76px;margin-top:12px;padding:12px 15px;border:1px solid #fff9;border-radius:17px 17px 17px 5px;background:#fffaf1ba;box-shadow:0 10px 28px #5e463717;text-align:left;transition:.4s}.dialogue.listening{transform:translateY(-3px);background:#fff8eeeb}.greeting{display:block;color:#59443b;font:600 15px/1.55 serif;animation:copy .7s}.hint{display:block;color:#79675d;font-size:12px;line-height:1.7}.listening-text{color:#a15a68;font-size:11px}
.actions{position:absolute;z-index:8;left:25px;right:25px;bottom:calc(env(safe-area-inset-bottom) + 35px)}button{width:100%;border:0}.primary{height:52px;border-radius:17px;background:linear-gradient(135deg,#bd6679,#d38291);color:#fffaf4;font-size:15px;font-weight:600;letter-spacing:1px;box-shadow:0 11px 22px #8c495838}.quiet{margin-top:5px;background:transparent;color:#433931a3;font-size:11px}.tip{position:absolute;z-index:4;bottom:16px;left:0;right:0;text-align:center;color:#46413778;font-size:9px;letter-spacing:1px}.ripple{position:absolute;z-index:2;width:12px;height:12px;margin:-6px;border:1px solid #fffc;border-radius:50%;animation:ripple 1.5s forwards;pointer-events:none}
@keyframes breathe{50%{transform:scale(1.06);opacity:.78}}@keyframes drift{to{transform:translateX(90px)}}@keyframes float{50%{transform:translateX(-50%) translateY(-5px) rotate(.6deg)}}@keyframes wave{50%{transform:translateY(-4px) rotate(2deg)}}@keyframes leaf{50%{transform:translate(8px,-10px) rotate(9deg);opacity:.7}}@keyframes copy{from{opacity:0;transform:translateY(5px)}}@keyframes ripple{to{width:130px;height:130px;margin:-65px;opacity:0}}
</style>
</head>
<body>
<main class="home" id="home">
<div class="glow"></div><div class="mist a"></div><div class="mist b"></div>
<div class="brand"><div class="mark">桃</div><div><span class="brand-cn">桃紫有光</span><span class="brand-en">TAOLIGHT AI</span></div></div>
<div class="leaf l1">𖧧</div><div class="leaf l2">𖧧</div><div class="leaf l3">𖧧</div>
<section class="hero">
<div class="character-wrap" id="character"><div class="halo"></div><div class="character">
<div class="selfie"><div class="phone"></div><div class="stick"></div></div>
<div class="ear left"></div><div class="ear right"></div><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="smile"></div></div>
<div class="body"><div class="belly"></div></div><div class="cape"></div>
<div class="arm peach-arm"><div class="hand"></div><div class="peach"><div class="peach-leaf"></div></div></div><div class="arm selfie-arm"><div class="hand"></div></div>
</div><div class="bubble">今儿挺好</div></div>
<div><span class="kicker">退休后的桃园生活记录者</span><span class="title">大圣故事工坊</span><span class="promise">每一颗桃，都藏着一个故事。</span></div>
<div class="dialogue" id="dialogue"><span class="greeting" id="greeting"></span><span class="hint" id="hint"></span><span class="listening-text" id="listening"></span></div>
</section>
<div class="actions"><button class="primary" id="start">把故事说给大圣　→</button><button class="quiet" id="next">先陪大圣看看桃</button></div><div class="tip">轻点桃园 · 听大圣回应</div>
</main>
<script>
const copy=[
['老朋友，好久不见。','俺老孙今天又发现了一件有意思的事。'],
['以前俺管天上的蟠桃园。','现在嘛，喜欢看看人间的桃。'],
['生活再累，也得给自己留一口甜。','坐一会儿，听听风，也听听你的故事。']
];let i=0;const g=document.querySelector('#greeting'),h=document.querySelector('#hint'),d=document.querySelector('#dialogue'),l=document.querySelector('#listening');
function show(){g.textContent=copy[i][0];h.textContent=copy[i][1]}function next(){i=(i+1)%copy.length;show();d.classList.add('listening');l.textContent='俺老孙听着呢 ···';setTimeout(()=>{d.classList.remove('listening');l.textContent=''},1300)}
show();setTimeout(()=>document.querySelector('#character').classList.add('ready'),300);setInterval(next,4800);
document.querySelector('#next').onclick=e=>{e.stopPropagation();next()};document.querySelector('#start').onclick=e=>{e.stopPropagation();alert('俺老孙等你开讲。\n下一步将进入故事创作流程。')};
document.querySelector('#home').onclick=e=>{const r=document.createElement('i');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.querySelector('#home').appendChild(r);d.classList.add('listening');l.textContent='俺老孙听着呢 ···';setTimeout(()=>r.remove(),1500);setTimeout(()=>{d.classList.remove('listening');l.textContent=''},1300)};
</script>
</body></html>
